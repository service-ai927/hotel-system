<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Azure Coast 予約管理</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: photo-lit sidebar + main column whose view banner floats on a full-bleed backdrop photo; glass panels scroll over it */
:root{
  --bg:#e9f0ef;
  --surface:rgba(255,255,255,.84);
  --surface-solid:#ffffff;
  --surface-2:#f2f6f5;
  --line:rgba(14,52,58,.12);
  --fg:#0e272c;
  --muted:#5a7175;
  --accent:#0a7c84;
  --accent-fg:#ffffff;
  --accent-soft:rgba(10,124,132,.12);
  --sun:#e0663e;
  --sun-soft:rgba(224,102,62,.14);
  --ok:#17895c;--ok-soft:rgba(23,137,92,.13);
  --warn:#b97806;--warn-soft:rgba(217,145,19,.16);
  --bad:#cf3b3b;--bad-soft:rgba(207,59,59,.12);
  --info:#2f6fc6;--info-soft:rgba(47,111,198,.12);
  --violet:#7253c4;--violet-soft:rgba(114,83,196,.13);
  --gray-soft:rgba(90,113,117,.14);
  --on-photo:#ffffff;
  --bar-fg:#ffffff;
  --photo-shade:rgba(6,24,28,.55);
  --side-bg:rgba(7,26,30,.78);
  --side-fg:#e4f1f0;
  --side-muted:#93b3b4;
  --shadow:0 10px 30px -12px rgba(8,40,46,.28);
  --f-display:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif;
  --f-body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic UI","Meiryo",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Consolas,monospace;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#071417;--surface:rgba(14,30,33,.84);--surface-solid:#0f2124;--surface-2:#132a2d;--line:rgba(180,226,226,.12);
  --fg:#e3efee;--muted:#8fa8aa;--accent:#3cc3c4;--accent-fg:#04201f;--accent-soft:rgba(60,195,196,.15);
  --sun:#ff9268;--sun-soft:rgba(255,146,104,.16);
  --ok:#3fcf92;--ok-soft:rgba(63,207,146,.14);--warn:#f2b84b;--warn-soft:rgba(242,184,75,.15);
  --bad:#ff7272;--bad-soft:rgba(255,114,114,.14);--info:#77a9ff;--info-soft:rgba(119,169,255,.15);
  --violet:#ad94ff;--violet-soft:rgba(173,148,255,.15);--gray-soft:rgba(143,168,170,.15);
  --shadow:0 12px 34px -14px rgba(0,0,0,.6);--bar-fg:#06171a;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#071417;--surface:rgba(14,30,33,.84);--surface-solid:#0f2124;--surface-2:#132a2d;--line:rgba(180,226,226,.12);
  --fg:#e3efee;--muted:#8fa8aa;--accent:#3cc3c4;--accent-fg:#04201f;--accent-soft:rgba(60,195,196,.15);
  --sun:#ff9268;--sun-soft:rgba(255,146,104,.16);
  --ok:#3fcf92;--ok-soft:rgba(63,207,146,.14);--warn:#f2b84b;--warn-soft:rgba(242,184,75,.15);
  --bad:#ff7272;--bad-soft:rgba(255,114,114,.14);--info:#77a9ff;--info-soft:rgba(119,169,255,.15);
  --violet:#ad94ff;--violet-soft:rgba(173,148,255,.15);--gray-soft:rgba(143,168,170,.15);
  --shadow:0 12px 34px -14px rgba(0,0,0,.6);--bar-fg:#06171a;color-scheme:dark}

*{box-sizing:border-box}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num,.tab{font-variant-numeric:tabular-nums}
.mono{font-family:var(--f-mono);font-size:.92em;letter-spacing:.02em}
h1,h2,h3{margin:0;text-wrap:balance}

.app{display:grid;grid-template-columns:252px minmax(0,1fr);min-height:100%}
.side{position:sticky;top:0;height:100vh;color:var(--side-fg);background:linear-gradient(180deg,rgba(7,26,30,.55),var(--side-bg) 40%),url(img/night.jpg) center/cover;display:flex;flex-direction:column;padding:22px 14px 16px;gap:18px;z-index:30;overflow-y:auto}
.brand{display:flex;align-items:center;gap:11px;padding:0 8px}
.brand-mark{width:38px;height:38px;border-radius:11px;background:linear-gradient(140deg,var(--accent),var(--sun));display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:19px;color:var(--on-photo);flex:none}
.brand b{font-family:var(--f-display);font-size:17px;letter-spacing:.04em;display:block;line-height:1.2}
.brand small{color:var(--side-muted);font-size:11px;letter-spacing:.12em}
.nav{display:flex;flex-direction:column;gap:2px}
.nav-h{font-size:10.5px;letter-spacing:.16em;color:var(--side-muted);padding:12px 12px 4px}
.nav a{display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:10px;color:var(--side-fg);text-decoration:none;font-size:13.5px;transition:background .15s}
.nav a svg{width:18px;height:18px;opacity:.85;flex:none}
.nav a:hover{background:rgba(255,255,255,.08)}
.nav a.on{background:rgba(255,255,255,.14);box-shadow:inset 0 0 0 1px rgba(255,255,255,.14)}
.nav a .cnt{margin-left:auto;font-size:11px;background:var(--sun);color:var(--on-photo);padding:0 7px;border-radius:99px;line-height:18px}
.side-foot{margin-top:auto;display:flex;align-items:center;gap:10px;padding:10px;border-radius:12px;background:rgba(255,255,255,.07)}
.avatar{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13px;flex:none;background:var(--accent-soft);color:var(--accent)}
.side-foot .avatar{background:rgba(255,255,255,.16);color:var(--side-fg)}
.side-foot small{display:block;color:var(--side-muted);font-size:11px}

.main{position:relative;min-width:0;isolation:isolate}
.backdrop{position:absolute;inset:0 0 auto 0;height:430px;z-index:-1;overflow:hidden}
.backdrop div{position:absolute;inset:0;background-size:cover;background-position:center 60%;transition:opacity .7s ease}
.backdrop::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(4,22,26,.5) 0%,rgba(4,22,26,.18) 45%,var(--bg) 100%)}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:10px;padding-block:12px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));transition:background .2s}
.topbar.solid{background:var(--surface);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.topbar.solid .tb-btn{color:var(--fg);background:var(--surface-2);border-color:var(--line)}
.search-btn{flex:1;max-width:420px;display:flex;align-items:center;gap:9px;padding:9px 14px;border-radius:12px;border:1px solid rgba(255,255,255,.28);background:rgba(255,255,255,.16);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);color:var(--on-photo);cursor:pointer;text-align:left}
.topbar.solid .search-btn{color:var(--muted);background:var(--surface-2);border-color:var(--line)}
.search-btn svg{width:17px;height:17px}
.search-btn kbd{margin-left:auto;font-family:var(--f-mono);font-size:11px;opacity:.75;border:1px solid currentColor;border-radius:5px;padding:0 5px}
.tb-sp{flex:1}
.tb-btn{position:relative;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;border:1px solid rgba(255,255,255,.28);background:rgba(255,255,255,.16);color:var(--on-photo);cursor:pointer;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.tb-btn svg{width:19px;height:19px}
.tb-btn .dot{position:absolute;top:8px;right:9px;width:8px;height:8px;border-radius:50%;background:var(--sun);box-shadow:0 0 0 2px var(--surface-solid)}
.menu-btn{display:none}

.view{padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));padding-block:6px 48px;display:flex;flex-direction:column;gap:18px;animation:rise .45s ease both}
@keyframes rise{from{transform:translateY(8px);opacity:.4}to{transform:none;opacity:1}}
.hero{color:var(--on-photo);padding-block:26px 30px;display:flex;flex-wrap:wrap;align-items:flex-end;gap:16px 24px;text-shadow:0 2px 18px rgba(0,0,0,.35)}
.hero-t{flex:1 1 360px;min-width:0}
.eyebrow{font-size:11.5px;letter-spacing:.2em;text-transform:uppercase;opacity:.9}
.hero h1{font-family:var(--f-display);font-weight:700;font-size:clamp(26px,3.4vw,40px);line-height:1.2;letter-spacing:.02em;margin-top:6px}
.hero p{margin:8px 0 0;opacity:.92;max-width:60ch}
.hero-actions{display:flex;flex-wrap:wrap;gap:8px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.chip-photo{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:99px;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.28);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);font-size:12.5px;text-shadow:none}

.panel{background:var(--surface);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);min-width:0}
.panel-h{display:flex;align-items:center;flex-wrap:wrap;gap:10px;padding:16px 18px 0}
.panel-h h2{font-size:15px;font-weight:700}
.panel-h .sub{color:var(--muted);font-size:12.5px}
.panel-h .r{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.panel-b{padding:14px 18px 18px}
.grid{display:grid;gap:18px}
.g-kpi{grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.g-2{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}
.g-2e{grid-template-columns:repeat(2,minmax(0,1fr))}
.g-3{grid-template-columns:repeat(3,minmax(0,1fr))}
@media (max-width:1180px){.g-2,.g-3{grid-template-columns:minmax(0,1fr)}}
@media (max-width:820px){.g-2e{grid-template-columns:minmax(0,1fr)}}

.kpi{padding:14px 16px;display:flex;flex-direction:column;gap:2px}
.kpi .l{font-size:12px;color:var(--muted);letter-spacing:.04em}
.kpi .v{font-size:25px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.01em;line-height:1.3}
.kpi .v small{font-size:13px;font-weight:500;color:var(--muted);margin-left:2px}
.kpi .d{font-size:12px;color:var(--muted)}
.up{color:var(--ok)}.down{color:var(--bad)}
.meter{height:6px;border-radius:99px;background:var(--gray-soft);overflow:hidden;margin-top:6px}
.meter i{display:block;height:100%;border-radius:inherit;background:var(--accent)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:8px 14px;border-radius:10px;border:1px solid var(--line);background:var(--surface-solid);color:var(--fg);cursor:pointer;font-weight:500;font-size:13px;white-space:nowrap;transition:transform .08s,background .15s,border-color .15s}
.btn:hover{border-color:var(--accent)}
.btn:active{transform:translateY(1px)}
.btn svg{width:16px;height:16px}
.btn-p{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn-p:hover{filter:brightness(1.07)}
.btn-sun{background:var(--sun);border-color:var(--sun);color:var(--on-photo)}
.btn-ghost{background:transparent}
.btn-danger{color:var(--bad);border-color:var(--bad-soft)}
.btn-danger:hover{border-color:var(--bad)}
.btn-photo{background:rgba(255,255,255,.18);border-color:rgba(255,255,255,.35);color:var(--on-photo);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);text-shadow:none}
.btn-sm{padding:5px 10px;font-size:12px;border-radius:8px}
.btn[disabled]{opacity:.45;cursor:not-allowed}

.pill{display:inline-flex;align-items:center;gap:5px;padding:1px 9px;border-radius:99px;font-size:11.5px;font-weight:500;white-space:nowrap;line-height:20px}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.nodot::before{display:none}
.p-ok{background:var(--ok-soft);color:var(--ok)}.p-warn{background:var(--warn-soft);color:var(--warn)}.p-bad{background:var(--bad-soft);color:var(--bad)}
.p-info{background:var(--info-soft);color:var(--info)}.p-violet{background:var(--violet-soft);color:var(--violet)}.p-muted{background:var(--gray-soft);color:var(--muted)}
.p-accent{background:var(--accent-soft);color:var(--accent)}.p-sun{background:var(--sun-soft);color:var(--sun)}
.tag{display:inline-block;font-size:11px;padding:0 7px;border-radius:6px;background:var(--surface-2);border:1px solid var(--line);color:var(--muted);line-height:19px;white-space:nowrap}

.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{font-size:11.5px;color:var(--muted);font-weight:500;text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap;letter-spacing:.04em}
th.sortable{cursor:pointer;user-select:none}
th.sortable:hover{color:var(--fg)}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle;white-space:nowrap}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--accent-soft)}
td.r,th.r{text-align:right}
.who{display:flex;align-items:center;gap:10px}
.who .avatar{width:30px;height:30px;font-size:12px}
.who b{font-weight:500;display:block;line-height:1.3}
.who small{color:var(--muted);font-size:11.5px}

.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.inp,.sel{padding:8px 11px;border-radius:10px;border:1px solid var(--line);background:var(--surface-solid);min-width:0}
.inp:focus,.sel:focus{outline:2px solid var(--accent-soft);border-color:var(--accent)}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label{font-size:12px;color:var(--muted);font-weight:500}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.form-grid .full{grid-column:1/-1}
textarea.inp{resize:vertical;min-height:70px}
.seg{display:inline-flex;padding:3px;border-radius:11px;background:var(--surface-2);border:1px solid var(--line);gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:6px 12px;border-radius:8px;cursor:pointer;font-size:12.5px;color:var(--muted)}
.seg button.on{background:var(--surface-solid);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.12);font-weight:500}
.switch{position:relative;width:38px;height:22px;flex:none;appearance:none;-webkit-appearance:none;background:var(--gray-soft);border-radius:99px;cursor:pointer;transition:background .15s;border:1px solid var(--line)}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:var(--surface-solid);box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .15s}
.switch:checked{background:var(--accent)}
.switch:checked::after{transform:translateX(16px)}

.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.li .grow{flex:1;min-width:0}
.li .grow b{font-weight:500}
.li .grow small{display:block;color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.empty{padding:22px;text-align:center;color:var(--muted);font-size:13px}

.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart text{fill:var(--muted);font-size:11px;font-family:var(--f-body)}
.chart .gl{stroke:var(--line)}
.hbar{display:grid;grid-template-columns:110px minmax(0,1fr) 84px;gap:10px;align-items:center;font-size:12.5px;padding:5px 0}
.hbar .t{height:10px;border-radius:99px;background:var(--gray-soft);overflow:hidden}
.hbar .t i{display:block;height:100%;border-radius:inherit}
.hbar .v{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}

.stack{display:flex;height:12px;border-radius:99px;overflow:hidden;background:var(--gray-soft)}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:12px;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:9px;height:9px;border-radius:3px}

/* timeline */
.tl-wrap{overflow-x:auto;border-top:1px solid var(--line)}
.tl{min-width:980px;--lab:152px;--n:14;position:relative}
.tl-row{display:grid;grid-template-columns:var(--lab) repeat(var(--n),minmax(54px,1fr));position:relative;border-bottom:1px solid var(--line)}
.tl-head{position:sticky;top:0;background:var(--surface-solid);z-index:3}
.tl-head .c{padding:8px 4px;text-align:center;font-size:11.5px;color:var(--muted);line-height:1.3}
.tl-head .c b{display:block;font-size:15px;color:var(--fg);font-weight:600}
.tl-head .c.we b{color:var(--sun)}
.tl-head .c.today{background:var(--accent-soft)}
.tl-head .c.today b{color:var(--accent)}
.tl-lab{position:sticky;left:0;background:var(--surface-solid);z-index:2;padding:8px 12px;font-size:12.5px;border-right:1px solid var(--line);display:flex;align-items:center;gap:8px;min-height:44px}
.tl-lab b{font-weight:700;font-variant-numeric:tabular-nums}
.tl-lab small{color:var(--muted);font-size:11px}
.tl-grp{background:var(--surface-2);font-size:11.5px;color:var(--muted);font-weight:700;letter-spacing:.05em}
.tl-grp .tl-lab{background:var(--surface-2);min-height:30px;padding-block:4px}
.tl-c{border-left:1px solid var(--line);min-height:44px;cursor:cell}
.tl-c.we{background:var(--sun-soft)}
.tl-c.today{background:var(--accent-soft)}
.tl-c.drop{background:var(--accent);opacity:.35}
.tl-c.ooo{background:repeating-linear-gradient(135deg,var(--gray-soft) 0 6px,transparent 6px 12px);cursor:not-allowed}
.tl-grp .tl-c{min-height:30px;cursor:default}
.tl-bars{position:absolute;top:0;bottom:0;left:var(--lab);right:0;pointer-events:none}
.bar{position:absolute;top:6px;bottom:6px;border-radius:9px;padding:0 9px;display:flex;align-items:center;gap:6px;font-size:12px;font-weight:500;overflow:hidden;white-space:nowrap;cursor:grab;pointer-events:auto;box-shadow:0 2px 8px -3px rgba(0,0,0,.35);color:var(--bar-fg)}
.bar small{opacity:.85;font-weight:400}
.bar.s-confirmed{background:var(--info)}
.bar.s-tentative{background:var(--violet)}
.bar.s-inhouse{background:var(--ok)}
.bar.s-checkedout{background:var(--muted)}
.bar.s-noshow{background:var(--warn)}
.tl.dragging .bar{pointer-events:none}
.bar.clipl{border-top-left-radius:0;border-bottom-left-radius:0}
.bar.clipr{border-top-right-radius:0;border-bottom-right-radius:0}
.bar.vip::after{content:"VIP";font-size:9.5px;letter-spacing:.08em;padding:0 5px;border-radius:4px;background:rgba(255,255,255,.28);margin-left:auto}
.unassigned{display:flex;flex-wrap:wrap;gap:8px}
.ua{display:inline-flex;gap:8px;align-items:center;padding:6px 11px;border-radius:10px;border:1px dashed var(--violet);background:var(--violet-soft);font-size:12.5px;cursor:grab}

/* rooms */
.room-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.room{position:relative;border-radius:var(--r);overflow:hidden;border:1px solid var(--line);background:var(--surface-solid);display:flex;flex-direction:column;cursor:pointer;transition:transform .15s,box-shadow .15s}
.room:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.room .ph{height:108px;background-size:cover;background-position:center;position:relative}
.room .ph::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 30%,rgba(4,20,24,.72))}
.room .no{position:absolute;left:12px;bottom:8px;z-index:1;color:var(--on-photo);font-family:var(--f-display);font-size:26px;font-weight:700;line-height:1}
.room .st{position:absolute;right:10px;top:10px;z-index:1}
.room .st .pill{background:var(--surface-solid)}
.room .bd{padding:10px 12px 12px;display:flex;flex-direction:column;gap:3px;font-size:12.5px}
.room .bd b{font-weight:500}
.room .bd small{color:var(--muted)}
.type-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.tcard{border-radius:var(--r);overflow:hidden;border:1px solid var(--line);background:var(--surface-solid);display:flex;flex-direction:column}
.tcard .ph{aspect-ratio:16/9;max-width:100%;background-size:cover;background-position:center;position:relative}
.tcard .ph .pill{position:absolute;left:10px;top:10px;background:var(--surface-solid)}
.tcard .bd{padding:12px 14px 14px;display:flex;flex-direction:column;gap:8px;flex:1}
.tcard h3{font-family:var(--f-display);font-size:17px}
.tcard .meta{display:flex;flex-wrap:wrap;gap:6px}
.tcard .price{display:flex;align-items:baseline;gap:6px;margin-top:auto}
.tcard .price b{font-size:19px;font-variant-numeric:tabular-nums}
.tcard .price small{color:var(--muted)}
.tcard.pick{cursor:pointer;transition:box-shadow .15s,border-color .15s}
.tcard.pick:hover{border-color:var(--accent)}
.tcard.sel{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.tcard.dis{opacity:.5;cursor:not-allowed}

.kanban{display:grid;grid-template-columns:repeat(4,minmax(220px,1fr));gap:14px;overflow-x:auto;padding-bottom:4px}
.kcol{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:10px;min-height:200px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.kcol h3{font-size:13px;display:flex;align-items:center;gap:8px}
.kcol h3 .n{margin-left:auto;color:var(--muted);font-weight:500}
.ktask{background:var(--surface-solid);border:1px solid var(--line);border-radius:11px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;font-size:12.5px}
.ktask .top{display:flex;align-items:center;gap:8px}
.ktask .top b{font-size:16px;font-family:var(--f-display)}
.ktask .acts{display:flex;gap:6px;flex-wrap:wrap}
.ktask .sel{padding:4px 8px;font-size:12px;border-radius:8px}

/* rate calendar */
.rcal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.rcal .h{font-size:11px;color:var(--muted);text-align:center}
.rday{border-radius:10px;border:1px solid var(--line);padding:6px 8px;font-size:11.5px;cursor:pointer;background:var(--surface-solid);display:flex;flex-direction:column;gap:1px;min-width:0}
.rday:hover{border-color:var(--accent)}
.rday .dd{color:var(--muted)}
.rday b{font-size:13px;font-variant-numeric:tabular-nums;overflow:hidden;text-overflow:ellipsis}
.rday.hi{background:var(--sun-soft)}
.rday.ov{box-shadow:inset 0 0 0 2px var(--accent)}
.rday.past{opacity:.4;pointer-events:none}
.rday .oc{height:3px;border-radius:99px;background:var(--gray-soft);overflow:hidden;margin-top:3px}
.rday .oc i{display:block;height:100%;background:var(--accent)}

.drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);background:var(--surface-solid);z-index:51;display:flex;flex-direction:column;box-shadow:-20px 0 50px -20px rgba(0,0,0,.4);animation:slide .25s ease;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
@keyframes slide{from{transform:translateX(30px);opacity:.3}}
.dr-cover{height:170px;flex:none;background-size:cover;background-position:center;position:relative;color:var(--on-photo);display:flex;align-items:flex-end;padding:16px 20px}
.dr-cover::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(4,20,24,.15),rgba(4,20,24,.8))}
.dr-cover>*{position:relative}
.dr-cover h2{font-family:var(--f-display);font-size:24px}
.dr-cover .x{position:absolute;top:12px;right:12px}
.dr-body{flex:1;overflow-y:auto;padding:16px 20px;display:flex;flex-direction:column;gap:16px}
.dr-foot{flex:none;border-top:1px solid var(--line);padding:12px 20px;display:flex;gap:8px;flex-wrap:wrap}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line)}
.tabs button{border:0;background:none;padding:8px 12px;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;font-size:13px}
.tabs button.on{color:var(--fg);border-color:var(--accent);font-weight:500}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 18px;font-size:13px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;min-width:0}
.modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(640px,calc(100% - 24px));max-height:calc(100% - 32px);background:var(--surface-solid);border-radius:18px;z-index:52;display:flex;flex-direction:column;box-shadow:0 30px 80px -20px rgba(0,0,0,.5);animation:pop .22s ease;overflow:hidden}
.modal.wide{width:min(960px,calc(100% - 24px))}
@keyframes pop{from{transform:translate(-50%,-48%);opacity:.3}}
.m-h{display:flex;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line)}
.m-h h2{font-size:17px}
.m-h .x{margin-left:auto}
.m-b{padding:18px 20px;overflow-y:auto;display:flex;flex-direction:column;gap:16px}
.m-f{padding:12px 20px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.icon-btn{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:var(--surface-solid);display:grid;place-items:center;cursor:pointer;flex:none}
.icon-btn svg{width:17px;height:17px}
.dr-cover .icon-btn{background:rgba(255,255,255,.2);border-color:rgba(255,255,255,.35);color:var(--on-photo)}
.steps{display:flex;gap:6px;flex-wrap:wrap}

.steps span.on{color:var(--fg);background:var(--accent-soft)}
.steps span.on i{background:var(--accent);color:var(--accent-fg)}
.steps span.done i{background:var(--ok);color:var(--on-photo)}
.sum{border-radius:12px;background:var(--surface-2);border:1px solid var(--line);padding:12px 14px;display:flex;flex-direction:column;gap:5px;font-size:13px}
.sum .row{display:flex;justify-content:space-between;gap:12px;font-variant-numeric:tabular-nums}
.sum .row span:first-child{color:var(--muted)}
.sum .tot{border-top:1px solid var(--line);padding-top:8px;margin-top:4px;font-weight:700;font-size:16px}
.sum .tot span:first-child{color:var(--fg)}
.note{font-size:12px;color:var(--muted)}
.alert{padding:10px 12px;border-radius:10px;font-size:12.5px;display:flex;gap:8px;align-items:flex-start}
.alert.warn{background:var(--warn-soft);color:var(--warn)}
.alert.info{background:var(--info-soft);color:var(--info)}
.alert.ok{background:var(--ok-soft);color:var(--ok)}
.check{display:flex;align-items:center;gap:9px;font-size:13px;cursor:pointer}
.check input{width:17px;height:17px;accent-color:var(--accent)}
.receipt{border:1px solid var(--line);border-radius:12px;padding:22px;background:var(--surface-solid);font-size:13px}
.receipt h3{font-family:var(--f-display);font-size:24px;text-align:center;letter-spacing:.5em;padding-left:.5em}
.receipt .amt{font-size:26px;font-weight:700;text-align:center;border-bottom:2px solid var(--fg);padding:8px 0;margin:14px auto;max-width:340px;font-variant-numeric:tabular-nums}
.stamp{width:62px;height:62px;border:2px solid var(--bad);color:var(--bad);border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-size:12px;line-height:1.2;text-align:center;transform:rotate(-12deg)}

.cmdk{position:fixed;left:50%;top:12vh;transform:translateX(-50%);width:min(600px,calc(100% - 24px));background:var(--surface-solid);border-radius:16px;z-index:52;box-shadow:0 30px 80px -20px rgba(0,0,0,.55);overflow:hidden;animation:fade .15s}
.cmdk input{width:100%;border:0;border-bottom:1px solid var(--line);padding:16px 18px;font-size:16px;background:transparent;outline:none}
.cmdk .res{max-height:55vh;overflow-y:auto;padding:6px}
.cmdk .it{display:flex;gap:12px;align-items:center;padding:9px 12px;border-radius:10px;cursor:pointer}
.cmdk .it:hover,.cmdk .it.on{background:var(--accent-soft)}
.cmdk .it .grow{flex:1;min-width:0}
.cmdk .it small{color:var(--muted);display:block;font-size:12px}
.cmdk .grp{font-size:11px;color:var(--muted);letter-spacing:.1em;padding:8px 12px 4px}
.notif{position:fixed;top:calc(64px + env(safe-area-inset-top,0px));right:max(16px,env(safe-area-inset-right,0px));width:min(380px,calc(100% - 32px));background:var(--surface-solid);border:1px solid var(--line);border-radius:16px;z-index:52;box-shadow:var(--shadow);overflow:hidden;animation:fade .15s}
.notif .list{max-height:60vh;overflow-y:auto;padding:0 16px}
.toasts{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:60;display:flex;flex-direction:column;gap:8px;align-items:flex-end}
.toast{background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:13px;box-shadow:var(--shadow);animation:rise .25s ease;display:flex;gap:9px;align-items:center;max-width:min(420px,calc(100vw - 32px))}
.toast svg{width:16px;height:16px;flex:none;color:var(--accent)}

@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;left:0;top:0;bottom:0;width:272px;height:auto;transform:translateX(-102%);transition:transform .25s;padding-left:max(14px,env(safe-area-inset-left,0px))}
  .side.open{transform:none;box-shadow:20px 0 60px rgba(0,0,0,.4)}
  .menu-btn{display:grid}
  .topbar,.view{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .search-btn kbd{display:none}
  .hbar{grid-template-columns:84px minmax(0,1fr) 72px}
  .hide-sm{display:none}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

function season(d){const x=P(d),m=x.getMonth()+1,day=x.getDate(),w=x.getDay();let k=1;
 if(w===5||w===6)k*=1.2;
 if(m===7||m===8||(m===12&&day>=27)||(m===1&&day<=3)||(m===4&&day>=29)||(m===5&&day<=5)||(m===3&&day>=20))k*=1.3;

function priceFor(typeId,ci,co,adults,children,planId,lead){
 const plan=planOf(planId)||S.plans[0];const days=range(ci,co);const ppl=adults+children;
 const nights=days.map(d=>({d,rate:nightRate(typeId,d)}));
 const room=nights.reduce((a,b)=>a+b.rate,0);
 const meal=plan.meal*(adults+children*.5)*days.length;
 const disc=Math.round((room+meal)*plan.disc);
 const sub=room+meal-disc;
 const service=Math.round(sub*S.cfg.service/100);
 const tax=Math.round((sub+service)*S.cfg.vat/100);
 const lodging=nights.reduce((a,n)=>a+lodgingTax((n.rate*(1-plan.disc))/Math.max(1,ppl))*ppl,0);
 return {nights,room,meal,disc,service,tax,lodging,total:sub+service+tax+lodging,plan:plan.id}
}

function barChart(data,{h=180,fmt=v=>v,max,hi=-1,color='var(--accent)',hiColor='var(--sun)',labelEvery=1}={}){
 const W=640,pl=34,pb=26,pt=18,n=data.length,cw=(W-pl)/n,bw=Math.min(30,cw*.62);max=max||Math.max(...data.map(d=>d.v))*1.1||1;

  if(i===hi||n<=16)s+=`<text x="${x+bw/2}" y="${yy-5}" text-anchor="middle" style="fill:var(--fg);font-size:10.5px">${fmt(d.v)}</text>`;
  if(i%labelEvery===0)s+=`<text x="${x+bw/2}" y="${h-8}" text-anchor="middle">${esc(d.l)}</text>`});
 return `<div class="chart">${s}</svg></div>`}

let RP='past';
V.reports=()=>{
 const days=RP==='past'?range(addD(TODAY,-29),addD(TODAY,1)):range(TODAY,addD(TODAY,30));
 const ds=days.map(d=>({d,...dayStats(d)}));
 const rev=ds.reduce((a,x)=>a+x.rev,0),sold=ds.reduce((a,x)=>a+x.sold,0),av=ds.reduce((a,x)=>a+x.av,0);
 const inP=r=>overlaps(r.ci,r.co,days[0],addD(days[days.length-1],1));
 const rs=S.res.filter(r=>inP(r));const canc=rs.filter(r=>r.status==='cancelled').length;const liveR=rs.filter(live);
 const los=liveR.reduce((a,r)=>a+diff(r.ci,r.co),0)/(liveR.length||1);const lead=liveR.reduce((a,r)=>a+diff(r.created,r.ci),0)/(liveR.length||1);
 const byT=S.types.map(t=>{let rv=0,n=0;ds.forEach(x=>soldOn(x.d).filter(r=>r.typeId===t.id).forEach(r=>{n++;rv+=(r.price.nights.find(k=>k.d===x.d)||{rate:0}).rate}));const inv=S.rooms.filter(r=>r.type===t.id).length*days.length;return {t,rv,n,occ:n/inv,adr:n?rv/n:0}});
 const byC=S.channels.map(c=>{const x=liveR.filter(r=>r.channel===c.id);return {c,n:x.length,rv:x.reduce((a,r)=>a+r.price.room,0)}}).sort((a,b)=>b.rv-a.rv);const cMax=Math.max(1,...byC.map(x=>x.rv));
 const ctry={};liveR.forEach(r=>{const c=guestOf(r.guestId).country;ctry[c]=(ctry[c]||0)+1});const cts=Object.entries(ctry).sort((a,b)=>b[1]-a[1]).slice(0,6);const ctMax=Math.max(1,...cts.map(x=>x[1]));
 const leadB=[[0,7,'0–7日'],[8,14,'8–14日'],[15,30,'15–30日'],[31,60,'31–60日'],[61,999,'61日〜']].map(([a,b,l])=>({l,v:liveR.filter(r=>{const x=diff(r.created,r.ci);return x>=a&&x<=b}).length}));
 return hero('Reports','経営レポート',RP==='past'?'過去30日の実績です。稼働率・ADR・RevPARの推移、客室タイプ別とチャネル別の成績を確認できます。':'今後30日のオンザブック（受注済み）予測です。',
  `<div class="seg" id="rpSeg" style="background:rgba(255,255,255,.2);border-color:rgba(255,255,255,.3)"><button data-k="past" class="${RP==='past'?'on':''}">過去30日 実績</button><button data-k="fut" class="${RP==='fut'?'on':''}">今後30日 予測</button></div>`,
  chipP(`${md(days[0])} 〜 ${md(days[days.length-1])}`))+
 `<div class="grid g-kpi">
  <div class="panel kpi"><span class="l">客室売上</span><span class="v">${yen(rev)}</span><span class="d">税・サ別</span></div>
  <div class="panel kpi"><span class="l">平均稼働率</span><span class="v">${pct(sold/av)}</span><span class="d">販売室数 ${sold.toLocaleString()} / ${av.toLocaleString()}</span></div>
  <div class="panel kpi"><span class="l">ADR</span><span class="v">${yen(rev/(sold||1))}</span><span class="d">平均客室単価</span></div>
  <div class="panel kpi"><span class="l">RevPAR</span><span class="v">${yen(rev/(av||1))}</span><span class="d">販売可能客室あたり売上</span></div>
  <div class="panel kpi"><span class="l">平均宿泊数 / リードタイム</span><span class="v">${los.toFixed(1)}<small>泊</small> ${lead.toFixed(0)}<small>日</small></span><span class="d">予約から到着まで</span></div>
  <div class="panel kpi"><span class="l">キャンセル率</span><span class="v">${pct(canc/(rs.length||1))}</span><span class="d">${canc}件 / ${rs.length}件</span></div>
 </div>
 <div class="panel"><div class="panel-h"><h2>稼働率と RevPAR の推移</h2><div class="legend" style="margin:0"><span><i style="background:var(--accent)"></i>稼働率（%）</span><span><i style="background:var(--sun)"></i>RevPAR（千円）</span></div></div><div class="panel-b">${lineChart([{v:ds.map(x=>x.occ*100),c:'var(--accent)',fill:true},{v:ds.map(x=>x.revpar/1000),c:'var(--sun)'}],ds.map(x=>md(x.d).replace(/\(.\)/,'')),{max:100,fmt:v=>Math.round(v),mark:RP==='past'?29:0})}</div></div>
 <div class="grid g-2e">
 <div class="panel"><div class="panel-h"><h2>客室タイプ別</h2></div><div class="panel-b"><div class="table-wrap"><table><thead><tr><th>タイプ</th><th class="r">販売室泊</th><th class="r">稼働率</th><th class="r">ADR</th><th class="r">売上</th></tr></thead><tbody>${byT.map(x=>`<tr><td>${x.t.name}</td><td class="r num">${x.n}</td><td class="r num">${pct(x.occ)}</td><td class="r num">${yen(x.adr)}</td><td class="r num">${yen(x.rv)}</td></tr>`).join('')}</tbody></table></div></div></div>
 <div class="panel"><div class="panel-h"><h2>チャネル別 客室売上</h2></div><div class="panel-b">${byC.map(x=>hbar(x.c.name,x.rv,cMax,yen(x.rv),x.c.color)).join('')}</div></div>
 <div class="panel"><div class="panel-h"><h2>予約リードタイム分布</h2></div><div class="panel-b">${barChart(leadB,{h:170,fmt:v=>Math.round(v)})}</div></div>
 <div class="panel"><div class="panel-h"><h2>国・地域別 予約件数</h2></div><div class="panel-b">${cts.map(([c,n])=>hbar({JP:'日本',US:'アメリカ',AU:'オーストラリア',TW:'台湾',KR:'韓国',FR:'フランス',DE:'ドイツ',GB:'イギリス',VN:'ベトナム',SG:'シンガポール',IT:'イタリア',HK:'香港',CA:'カナダ',SE:'スウェーデン'}[c]||c,n,ctMax,n+'件','var(--info)')).join('')}</div></div>
 </div>`};
V.reports_after=()=>$$('#rpSeg button').forEach(b=>b.onclick=()=>{RP=b.dataset.k;render()});

  `<button class="btn btn-sun" data-act="sync-all">${ic('refresh')}全チャネルを同期</button>`,chipP(`接続中 ${S.channels.filter(c=>c.on).length}/${S.channels.length}`)+chipP(`エラー ${S.channels.filter(c=>c.err).length}件`))+

 </tbody></table></div></div></div>
 <div class="grid g-2e">
 <div class="panel"><div class="panel-h"><h2>在庫配分（本日）</h2><span class="sub">全チャネル共通在庫（プール型）</span></div><div class="panel-b">${S.types.map(t=>{const a=availCount(t.id,TODAY,addD(TODAY,1)),n=S.rooms.filter(r=>r.type===t.id).length;return hbar(t.name,n-a,n,`${a}室 残`,t.stop?'var(--muted)':'var(--accent)')}).join('')}</div></div>
 <div class="panel"><div class="panel-h"><h2>直販比率</h2></div><div class="panel-b">${(()=>{const d=m30.filter(r=>r.channel==='direct'||r.channel==='phone').length;return `<div class="kpi" style="padding:0"><span class="v">${pct(d/(m30.length||1))}</span><span class="d">直近30日の新規予約 ${m30.length}件のうち ${d}件が公式サイト・電話</span><div class="meter"><i style="width:${d/(m30.length||1)*100}%"></i></div></div><p class="note" style="margin-top:12px">OTA経由の手数料を抑えるには、公式サイト限定プランと会員ランク特典の告知が有効です。</p>`})()}</div></div>
 </div>`};

/* ---------- overlays ---------- */
function closeLayer(){$('#layer').innerHTML='';document.body.style.overflow=''}
function openLayer(html){$('#layer').innerHTML=`<div class="scrim" data-act="close"></div>`+html;document.body.style.overflow='hidden'}
function modal(title,body,foot='',wide=false){openLayer(`<div class="modal ${wide?'wide':''}" role="dialog" aria-modal="true"><div class="m-h"><h2>${title}</h2><button class="icon-btn x" data-act="close" aria-label="閉じる">${ic('x')}</button></div><div class="m-b">${body}</div>${foot?`<div class="m-f">${foot}</div>`:''}</div>`)}

let DR={id:null,tab:'ov'};
function openRes(id,tab='ov'){DR={id,tab};drawRes()}
function drawRes(){
 const r=resOf(DR.id);if(!r)return;const g=guestOf(r.guestId),t=typeOf(r.typeId),f=folio(r),p=r.price;
 let body='';
 if(DR.tab==='ov')body=`<div style="display:flex;gap:8px;flex-wrap:wrap">${pill(r.status)}<span class="tag">${chOf(r.channel).name}</span><span class="tag">${planOf(p.plan).name}</span>${g.rank==='VIP'?'<span class="pill nodot p-sun">VIP</span>':''}</div>
  ${g.flag?`<div class="alert warn">${esc(g.notes)}</div>`:''}
  <dl class="kv"><dt>ゲスト</dt><dd><a href="#" data-act="guest" data-id="${g.id}">${esc(g.name)}</a> · ${g.country}</dd><dt>連絡先</dt><dd>${esc(g.email)}<br>${esc(g.phone)}</dd>
  <dt>チェックイン</dt><dd>${ymd(r.ci)} ${S.cfg.cin}〜（到着予定 ${r.eta}）</dd><dt>チェックアウト</dt><dd>${ymd(r.co)} 〜${S.cfg.cout}</dd>
  <dt>客室</dt><dd>${r.roomId?r.roomId+'号室':'<span class="pill p-violet nodot">未割当</span>'} · ${t.name}（${t.size}㎡ · ${t.bed}）</dd><dt>人数</dt><dd>大人 ${r.adults}名${r.children?` · 子ども ${r.children}名`:''}</dd>
  <dt>予約日</dt><dd>${ymd(r.created)}（リードタイム ${diff(r.created,r.ci)}日）</dd><dt>リクエスト</dt><dd>${esc(r.requests)||'—'}</dd><dt>ゲストの好み</dt><dd>${g.prefs.map(x=>`<span class="tag">${esc(x)}</span>`).join(' ')||'—'}</dd>
  ${r.cancelReason?`<dt>キャンセル理由</dt><dd>${esc(r.cancelReason)}</dd>`:''}</dl>
  <div class="sum"><div class="row"><span>宿泊料金（${p.nights.length}泊）</span><span>${yen(p.room)}</span></div>${p.meal?`<div class="row"><span>お食事</span><span>${yen(p.meal)}</span></div>`:''}${p.disc?`<div class="row"><span>プラン割引</span><span>−${yen(p.disc)}</span></div>`:''}<div class="row"><span>サービス料・消費税・宿泊税</span><span>${yen(p.service+p.tax+p.lodging)}</span></div>${(r.extras||[]).length?`<div class="row"><span>館内利用</span><span>${yen(r.extras.reduce((a,e)=>a+e.amt,0))}</span></div>`:''}<div class="row tot"><span>請求合計</span><span>${yen(f.charges)}</span></div><div class="row"><span>入金済み</span><span>${yen(f.paid)}</span></div><div class="row"><span>残高</span><span style="color:${f.bal>0?'var(--bad)':'var(--ok)'};font-weight:700">${yen(f.bal)}</span></div></div>`;
 if(DR.tab==='fo')body=folioHtml(r);
 if(DR.tab==='log')body=`<div class="list">${r.log.slice().sort((a,b)=>b.t-a.t).map(l=>`<div class="li"><span class="mono" style="color:var(--muted);width:92px;flex:none">${stamp(l.t)}</span><span class="grow">${esc(l.msg)}</span></div>`).join('')}</div>`;
 let acts='';
 if(r.status==='tentative')acts+=`<button class="btn btn-p" data-act="confirm" data-id="${r.id}">${ic('check')}予約を確定</button>`;
 if((r.status==='confirmed'||r.status==='tentative')&&r.ci<=TODAY)acts+=`<button class="btn btn-p" data-act="checkin" data-id="${r.id}">${ic('login')}チェックイン</button>`;
 if(r.status==='inhouse')acts+=`<button class="btn btn-sun" data-act="checkout" data-id="${r.id}">${ic('logout')}精算・チェックアウト</button><button class="btn" data-act="extend" data-id="${r.id}">1泊延泊</button>`;
 if(['confirmed','tentative'].includes(r.status))acts+=`<button class="btn" data-act="edit" data-id="${r.id}">${ic('edit')}変更</button>`;
 if(['confirmed','tentative'].includes(r.status)&&!r.roomId)acts+=`<button class="btn" data-act="assign" data-id="${r.id}">部屋を割当</button>`;
 if(live(r))acts+=`<button class="btn" data-act="folio" data-id="${r.id}">${ic('receipt')}請求・入金</button>`;
 if(r.status==='checkedout'||f.paid>0)acts+=`<button class="btn" data-act="receipt" data-id="${r.id}">領収書</button>`;
 if(['confirmed','tentative'].includes(r.status))acts+=`<button class="btn btn-danger" data-act="cancel" data-id="${r.id}">${r.ci<TODAY?'ノーショー':'キャンセル'}</button>`;
 openLayer(`<aside class="drawer" role="dialog" aria-modal="true"><div class="dr-cover" style="background-image:url(${t.img})"><button class="icon-btn x" data-act="close" aria-label="閉じる">${ic('x')}</button><div><div class="mono" style="opacity:.85">${r.id}</div><h2>${esc(g.name)} 様</h2><div style="opacity:.9">${md(r.ci)} → ${md(r.co)} · ${diff(r.ci,r.co)}泊 · ${t.name}</div></div></div>
 <div class="dr-body"><div class="tabs">${[['ov','概要'],['fo','請求明細'],['log','履歴']].map(([k,l])=>`<button data-tab="${k}" class="${DR.tab===k?'on':''}">${l}</button>`).join('')}</div>${body}</div>${acts?`<div class="dr-foot">${acts}</div>`:''}</aside>`);

  csv:()=>{const rows=[['予約番号','ゲスト','客室','タイプ','チェックイン','チェックアウト','泊数','大人','子ども','プラン','経路','状態','合計']].concat(S.res.map(r=>[r.id,guestOf(r.guestId).name,r.roomId||'',typeOf(r.typeId).name,r.ci,r.co,diff(r.ci,r.co),r.adults,r.children,planOf(r.price.plan).name,chOf(r.channel).name,ST[r.status][0],r.price.total]));
   const t=rows.map(r=>r.map(c=>/[",\n]/.test(String(c))?`"${String(c).replace(/"/g,'""')}"`:c).join(',')).join('\n');try{navigator.clipboard.writeText(t).then(()=>toast(`${S.res.length}件をCSV形式でコピーしました`),()=>toast('クリップボードへのコピーが許可されていません'))}catch(_){toast('クリップボードへのコピーが許可されていません')}},
  pg:()=>{RF.page+= +el.dataset.d;render()},'rf-clear':()=>{RF={q:'',st:'active',ch:'',from:'',to:'',sort:'ci',dir:1,page:0};render()},
  cal:()=>{const d=+el.dataset.d;CAL.start=d?addD(CAL.start,d):addD(TODAY,-2);render()},
  hk:()=>{const t=S.tasks.find(x=>x.id===id);const to=el.dataset.to;t.status=to;const rm=roomOf(t.roomId);rm.hk={todo:'dirty',doing:'cleaning',inspect:'inspect',done:'clean'}[to];if(to==='done')t.doneAt=Date.now();if(to==='doing'&&!t.staff)t.staff=STAFF_HK[0];
   log(null,`${rm.id}号室 ${{todo:'清掃差し戻し',doing:'清掃開始',inspect:'清掃完了・点検待ち',done:'点検完了・販売可能'}[to]}`);commit(`${rm.id}号室：${{todo:'差し戻しました',doing:'清掃を開始しました',inspect:'点検待ちになりました',done:'販売可能になりました'}[to]}`)},
  'hk-stay':()=>{let n=0;S.res.filter(r=>r.status==='inhouse'&&r.co>TODAY).forEach(r=>{if(!S.tasks.some(t=>t.roomId===r.roomId&&t.status!=='done')){S.tasks.push({id:'T'+r.roomId+'-'+Date.now()+n,roomId:r.roomId,kind:'連泊清掃',status:'todo',staff:'',prio:false});roomOf(r.roomId).hk='dirty';n++}});commit(`連泊清掃タスクを${n}件作成しました`)},
  'hk-auto':()=>{const open=S.tasks.filter(t=>t.status!=='done'&&!t.staff);open.forEach(t=>{const ld=STAFF_HK.map(s=>[s,S.tasks.filter(x=>x.staff===s&&x.status!=='done').length]).sort((a,b)=>a[1]-b[1]);t.staff=ld[0][0]});commit(`${open.length}件の担当を負荷が均等になるよう割り当てました`)},
  'ooo-set':()=>{const rm=roomOf(id);const reason=$('#oo-r').value.trim()||'設備点検';const nn=+$('#oo-n').value;const to=addD(TODAY,nn);
   const clash=S.res.filter(r=>r.roomId===id&&live(r)&&r.status!=='checkedout'&&overlaps(TODAY,to,r.ci,r.co));if(clash.some(r=>r.status==='inhouse')){toast('在室中のため使用停止にできません。先に客室移動してください');return}
   clash.forEach(r=>{r.roomId=null;log(r,`${id}号室の使用停止により未割当へ変更`)});rm.ooo={from:TODAY,to,reason};log(null,`${id}号室 使用停止（${reason}）`);notify(`${id}号室を使用停止にしました：${reason}`,'muted');closeLayer();commit(`${id}号室を使用停止にしました${clash.length?`（予約${clash.length}件を未割当へ）`:''}`)},
  'ooo-clear':()=>{const rm=roomOf(id);rm.ooo=null;rm.hk='inspect';log(null,`${id}号室 使用停止を解除`);closeLayer();commit(`${id}号室の使用停止を解除しました（点検待ち）`)},
  'rate-day':()=>{const d=el.dataset.d;const t=typeOf(RT.type);const cur=nightRate(t.id,d);
   modal(`個別料金 — ${t.name}`,`<p>${ymd(d)} の販売価格を設定します。自動計算値は ${yen(Math.round(t.base*season(d)*(1+S.adj/100)/100)*100)} です。</p><div class="field"><label for="ov-v">1室1泊の料金</label><input class="inp num" type="number" id="ov-v" step="500" value="${cur}"></div>`,
   `${S.overrides[t.id]&&S.overrides[t.id][d]?`<button class="btn btn-ghost" data-act="ov-clear" data-d="${d}">自動計算に戻す</button>`:''}<button class="btn" data-act="close">キャンセル</button><button class="btn btn-p" data-act="ov-save" data-d="${d}">保存</button>`)},
  'ov-save':()=>{const d=el.dataset.d,v=Math.max(1000,Math.round(+$('#ov-v').value/100)*100);(S.overrides[RT.type]=S.overrides[RT.type]||{})[d]=v;log(null,`${typeOf(RT.type).name} ${md(d)} の料金を ${yen(v)} に設定`);closeLayer();commit(`${md(d)} の料金を ${yen(v)} に設定しました`)},
  'ov-clear':()=>{delete S.overrides[RT.type][el.dataset.d];closeLayer();commit('自動計算の料金に戻しました')},
  adj:()=>{S.adj+= +el.dataset.d;log(null,`全体料金調整 ${S.adj>0?'+':''}${S.adj}%`);commit(`全客室の料金を${S.adj>0?'+':''}${S.adj}% に調整しました`)},
  sync:()=>{el.disabled=true;el.innerHTML=ic('refresh')+'同期中…';setTimeout(()=>{const n=syncChannel(id);commit(`${chOf(id).name} と同期しました${n?`（新規予約 ${n}件を取込）`:''}`)},900)},
  'sync-all':()=>{el.disabled=true;setTimeout(()=>{let n=0;S.channels.filter(c=>c.on).forEach(c=>n+=syncChannel(c.id));commit(`全チャネルと同期しました（新規予約 ${n}件）`)},1100)},
  'guest-new':()=>openGuest(null),'guest-save':()=>saveGuest(id||null),
  'save-cfg':()=>{S.cfg.name=$('#s-name').value.trim()||S.cfg.name;S.cfg.cin=$('#s-cin').value;S.cfg.cout=$('#s-cout').value;S.cfg.service=Math.max(0,+$('#s-svc').value);S.cfg.vat=Math.max(0,+$('#s-vat').value);log(null,'施設設定を更新');commit('設定を保存しました')},
  reset:()=>modal('デモデータをリセット','<p>すべての予約・顧客・設定の変更を破棄し、初期のサンプルデータに戻します。</p>',`<button class="btn" data-act="close">戻る</button><button class="btn btn-danger" data-act="do-reset">リセットする</button>`),
  'do-reset':()=>{seed();closeLayer();commit('デモデータを初期状態に戻しました')},
 };
 if(A[a]){e.preventDefault();A[a]()}
});
function selectEl(n){const r=document.createRange();r.selectNodeContents(n);const s=getSelection();s.removeAllRanges();s.addRange(r)}
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();openSearch()}if(e.key==='Escape')closeLayer()});
$('#menuBtn').innerHTML=ic('menu');$('#searchBtn [data-i]').outerHTML=ic('search');$('#newBtn [data-i]').outerHTML=ic('plus');
$('#menuBtn').onclick=()=>$('#side').classList.toggle('open');
$('#searchBtn').onclick=openSearch;$('#bellBtn').onclick=openNotif;$('#newBtn').onclick=()=>openWizard();
$('#themeBtn').onclick=()=>{const d=document.documentElement.dataset.theme==='dark'||(!document.documentElement.dataset.theme&&(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches));setTheme(d?'light':'dark');if(VIEW==='settings')render()};
window.addEventListener('scroll',()=>$('#topbar').classList.toggle('solid',window.scrollY>120),{passive:true});
window.addEventListener('hashchange',route);
try{const th=localStorage.getItem('azure-theme');if(th)document.documentElement.dataset.theme=th}catch(e){}
themeIcon();
S=load();if(!S){seed();save()}
route();
})();
